appId: com.maximearnould.intro
name: Écran de connexion
---
# Vide le Keychain iOS (où Firebase stocke la session) sans effacer
# les données de l'app (l'URL du serveur du dev client est conservée)
- launchApp:
    clearKeychain: true

- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 15000
